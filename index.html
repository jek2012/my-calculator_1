  <body>
    <div id="root"></div>
  <style>
  /* Жесткое скрытие любых элементов, содержащих упоминание Netlify */
  [class*="netlify" i], 
  [id*="netlify" i], 
  img[src*="netlify" i], 
  div[class*="badge" i],
  .netlify-badge,
  #netlify-badge {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    height: 0 !important;
    width: 0 !important;
    position: absolute !important;
    top: -9999px !important;
    pointer-events: none !important;
  }
</style>
    <script>
  // Функция для удаления плашки Netlify
  function removeNetlifyBadge() {
    // Ищем любые элементы, содержащие netlify в классах, id или атрибутах
    const selectors = [
      '[class*="netlify" i]', 
      '[id*="netlify" i]', 
      '#netlify-badge', 
      '.netlify-badge',
      'iframe[src*="netlify" i]'
    ];
    
    selectors.forEach(selector => {
      document.querySelectorAll(selector).forEach(el => el.remove());
    });
  }

  # Запускаем проверку сразу при загрузке страницы
  document.addEventListener("DOMContentLoaded", removeNetlifyBadge);
  window.addEventListener("load", removeNetlifyBadge);

  # Следим за страницей: если Netlify попытается встроить плашку позже, скрипт её тут же удалит
  const observer = new MutationObserver(removeNetlifyBadge);
  observer.observe(document.body, { childList: true, subtree: true });
</script>

  </body>
